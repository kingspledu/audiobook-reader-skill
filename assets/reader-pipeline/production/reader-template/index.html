<!doctype html>
<html lang="en" data-story-id="$story_id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f5f1e8">
 <title>$title</title>
 <link rel="stylesheet" href="style.css">
 <link rel="manifest" href="manifest.webmanifest">
 <link rel="apple-touch-icon" href="assets/app-icon-192.png">
 <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
 <a class="skip" href="#reading">본문으로 이동</a>
 <header class="floating-reader" id="floating-reader">
  <details id="chapter-menu" class="chapter-menu"><summary>목차</summary><nav>$toc</nav></details>
  <label>글자 <input id="font-size" type="range" min="14" max="50" value="19"><output id="font-value">19pt</output></label>
  <button id="theme" type="button" aria-pressed="false">테마</button>
 </header>
 <main class="shell" id="reading"><header class="book-intro"><h1>$title</h1><p>$description</p><nav>$volumes</nav></header>
  <article>$chapters</article>
 </main>
 <script type="application/json" id="vocabulary-data">$vocabulary</script>
 <script src="app.js" defer></script><script src="pwa.js" defer></script>
</body></html>
